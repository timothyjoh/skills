<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
:root { color-scheme: light; }
body { margin: 0; background: #fbfbfa; color: #2b2b2b; font: 17px/1.65 Charter, "Iowan Old Style", Georgia, serif; }
article.say-doc { max-width: 44em; margin: 0 auto; padding: 3em 1.5em 4em; }
h1, h2, h3, h4, h5, h6 { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; line-height: 1.25; margin: 1.6em 0 .5em; }
h1 { font-size: 2em; margin-top: 0; }
h2 { font-size: 1.45em; border-bottom: 1px solid #e5e3df; padding-bottom: .25em; }
h3 { font-size: 1.2em; }
h4, h5, h6 { font-size: 1em; }
p, ul, ol, blockquote, table, pre { margin: 0 0 1em; }
li { margin: .2em 0; }
blockquote { border-left: 3px solid #d8d4cc; margin-left: 0; padding: .1em 1em; color: #555; }
a { color: #2f5fb3; }
code { font: .88em ui-monospace, SFMono-Regular, Menlo, monospace; background: #f0eeea; padding: .1em .3em; border-radius: 4px; }
pre { background: #f0eeea; padding: .8em 1em; border-radius: 6px; overflow-x: auto; }
pre code { background: none; padding: 0; }
table { border-collapse: collapse; width: 100%; font-size: .92em; }
th, td { border: 1px solid #e0ddd7; padding: .4em .6em; text-align: left; vertical-align: top; }
th { background: #f3f1ed; }
img { max-width: 100%; }
hr { border: none; border-top: 1px solid #e5e3df; margin: 2em 0; }
</style>
</head>

<!--__BODY__-->
</article>
</body>
